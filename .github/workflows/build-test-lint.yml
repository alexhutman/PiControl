name: Build and Test
env:
  REF: ${{ github.head_ref || github.ref_name }}
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  dedupe:
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Sanity checks
        run: |
            echo "ref/sha = ${{ env.REF }}/${{ env.SHA }}"
      - id: skip_check
        name: Check for duplicate jobs
        uses: fkirc/skip-duplicate-actions@v5.3.2
        with:
          concurrent_skipping: 'same_content_newer'
          paths_ignore: '["**/README.md", "**/docs/**"]'
  build:
    needs: dedupe
    runs-on: ubuntu-latest
    if: needs.dedupe.outputs.should_skip != 'true'
    steps:
      - name: Checkout libwebsockets
        uses: actions/checkout@v7.0.1
        with:
          repository: warmcat/libwebsockets
          path: libwebsockets
          ref: v5.0-stable
      - name: Install libuv headers
        run: |
          sudo apt install libuv1-dev
      - name: Install gnutls headers
        run: |
          sudo apt install libgnutls28-dev
      - name: Build + install libwebsockets
        working-directory: libwebsockets
        run: |
          mkdir build && cd build
          cmake -DLWS_WITH_LIBUV=1 ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig
      - name: Checkout PiControl
        uses: actions/checkout@v7.0.1
        with:
          path: picontrol
      - name: Build server
        working-directory: picontrol
        env:
          DEBUG: true
        run: |
          make server
  test:
    needs: dedupe
    runs-on: ubuntu-latest
    if: needs.dedupe.outputs.should_skip != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Build tests
        run: |
          make test
      - name: Run tests
        run: |
          sudo ./bin/run_tests
  lint:
    needs: dedupe
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Lint code
        run: |
          find . -type f \( -iname \*.c -o -iname \*.h \) | xargs clang-format -style=google --dry-run --Werror
